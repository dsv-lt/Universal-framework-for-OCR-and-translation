# ==============================================================================
# Шаблон метаданных PNG-спрайтов (glyphs_meta.yaml)
# Используется, когда в manifest.yaml задано script.renderer: "sprites".
#
# ВАЖНО для Windows/NTFS:
#   Файловая система Windows не различает регистр имён (A.png == a.png).
#   Поэтому для заглавных и строчных букв называйте файлы по-разному,
#   например: upper_A.png и lower_a.png.
# ==============================================================================

# Целевая высота строки (в пикселях) при рендере базовой синтетики
default_height: 64

# Стандартная ширина шага до следующего символа (в долях от высоты символа)
default_advance_ratio: 0.85

# Ширина пробела (в долях от default_height)
space_width_ratio: 0.55

# Межстрочный интервал (множитель от default_height)
line_height_ratio: 1.35

# Словарь символов: ключ — символ из charset, значение — список файлов и выравнивание
glyphs:
  "a":
    # Можно указать несколько файлов-вариантов: генератор будет выбирать случайный
    files:
      - "a.png"
    # Сдвиг по вертикали (в долях от высоты): >0 сдвигает вниз (для выносных элементов p/g/y)
    baseline_offset: 0.0
    # Масштаб конкретного глифа относительно default_height
    scale: 1.0
    # Необязательный индивидуальный шаг по ширине (если null — используется default_advance_ratio)
    advance_ratio: null
    # Является ли знак комбинируемой диакритикой / огласовкой (для абугид и т.п.)
    is_combining: false
    anchor: null
    anchor_offset: [0.0, 0.0]

  "g":
    files:
      - "g.png"
    baseline_offset: 0.22
    scale: 1.0
    advance_ratio: null
    is_combining: false

  # Пример комбинируемого знака (гласная над согласной для абугид вроде Тенгвара)
  # "^":
  #   files:
  #     - "diacritic_acute.png"
  #   is_combining: true
  #   anchor: "top"          # top | bottom | center
  #   anchor_offset: [0.0, -0.25]
